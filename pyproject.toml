[project]
name = "broscorptesttask"
version = "0.1.0"
description = "Telegram RAG bot that answers forest animals' questions from shared documents, citing sources"
readme = "README.md"
authors = [
    { name = "Andrew", email = "koroyed3883@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "asyncpg>=0.32.0",
    "groq>=1.7.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "anyio>=4.15.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
